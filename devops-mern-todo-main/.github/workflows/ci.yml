name: MERN CI

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

jobs:

  # ==========================================
  # MONGODB INITIALIZATION
  # ==========================================
  mongo-init:
    name: MongoDB Init
    runs-on: ubuntu-latest

    env:
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/todoapp
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Waiting for MongoDB
        run: |
          until nc -z localhost 27017; do
            echo "Waiting for MongoDB..."
            sleep 2
          done

          echo "MongoDB is up"

      - name: Seed MongoDB
        working-directory: ./backend
        run: node seedTasksData.js


  # ==========================================
  # BACKEND TEST
  # ==========================================
  test:
    name: Backend Tests
    runs-on: ubuntu-latest

    needs: mongo-init

    env:
      PORT: 5000
      MONGO_URI: mongodb://localhost:27017/todoapp
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Waiting for MongoDB
        run: |
          until nc -z localhost 27017; do
            echo "Waiting for MongoDB..."
            sleep 2
          done

          echo "MongoDB is up"

      - name: Seed MongoDB for Tests
        working-directory: ./backend
        run: node seedTasksData.js

      - name: Run Backend Tests
        working-directory: ./backend
        run: npm test